syntax = "proto3";

package ipc;
option go_package = "github.com/anomalyco/etcfuse/internal/ipc";

// EtcFS IPC protocol: C FUSE frontend ↔ Go metadata backend.
//
// The C binary handles all kernel FUSE communication and block device I/O.
// The Go binary handles all etcd metadata operations.
// They communicate over a Unix domain socket using this protobuf protocol.

// ---- Service definition ----

service EtcFSMeta {
    // Metadata operations (C blocks until Go responds)
    rpc Lookup(LookupReq) returns (LookupResp);
    rpc Getattr(GetattrReq) returns (AttrResp);
    rpc Readdir(ReaddirReq) returns (ReaddirResp);
    rpc Readlink(ReadlinkReq) returns (ReadlinkResp);
    rpc Statfs(StatfsReq) returns (StatfsResp);

    // Mutation operations
    rpc Create(CreateReq) returns (CreateResp);
    rpc Mkdir(MkdirReq) returns (CreateResp);
    rpc Unlink(UnlinkReq) returns (EmptyResp);
    rpc Rmdir(RmdirReq) returns (EmptyResp);
    rpc Rename(RenameReq) returns (EmptyResp);
    rpc Symlink(SymlinkReq) returns (CreateResp);
    rpc Link(LinkReq) returns (CreateResp);
    rpc Setattr(SetattrReq) returns (AttrResp);
    rpc Mknod(MknodReq) returns (CreateResp);

    // Open/release (for reference counting, lock checking)
    rpc Open(OpenReq) returns (OpenResp);
    rpc Release(ReleaseReq) returns (EmptyResp);
    rpc Opendir(OpendirReq) returns (EmptyResp);
    rpc Releasedir(ReleasedirReq) returns (EmptyResp);

    // Data path operations (ordering invariants enforced here)
    rpc AllocExtents(AllocExtentsReq) returns (AllocExtentsResp);   // allocate arena blocks for a write
    rpc CommitExtents(CommitExtentsReq) returns (EmptyResp);        // commit written extents to etcd

    // Flush/fsync
    rpc Fsync(FsyncReq) returns (EmptyResp);

    // Lock operations
    rpc Getlk(GetlkReq) returns (GetlkResp);
    rpc Setlk(SetlkReq) returns (EmptyResp);

    // Client-to-daemon notification: self-fence alert
    rpc NotifyFence(stream FenceEvent) returns (google.protobuf.Empty);
}

// ---- Common types ----

// FUSE attribute structure (matches kernel struct fuse_attr)
message Attr {
    uint64 ino       = 1;
    uint64 size      = 2;
    uint64 blocks    = 3;
    uint64 atime     = 4;
    uint64 mtime     = 5;
    uint64 ctime     = 6;
    uint32 atime_nsec = 7;
    uint32 mtime_nsec = 8;
    uint32 ctime_nsec = 9;
    uint32 mode      = 10;
    uint32 nlink     = 11;
    uint32 uid       = 12;
    uint32 gid       = 13;
    uint32 rdev      = 14;
    uint32 blksize   = 15;
}

// Block device extent — maps a file range to a disk range
message Extent {
    uint64 logical_off = 1;  // offset within the file
    uint64 disk_off    = 2;  // offset on the raw block device
    uint64 length      = 3;  // extent length in bytes
    uint64 generation  = 4;  // fencing generation at write time
}

// Directory entry (for readdir)
message Dirent {
    uint64 ino   = 1;
    string name  = 2;
    uint32 type  = 3;  // DT_REG, DT_DIR, DT_LNK, etc.
    uint64 off   = 4;  // offset cookie for telldir/seekdir
}

// POSIX lock info (for fcntl/flock)
message LockInfo {
    uint64 start  = 1;
    uint64 length  = 2;
    uint32 type   = 3;  // F_RDLCK, F_WRLCK, F_UNLCK
    uint32 pid    = 4;
}

message StatfsInfo {
    uint64 blocks  = 1;
    uint64 bfree   = 2;
    uint64 bavail  = 3;
    uint64 files   = 4;
    uint64 ffree   = 5;
    uint32 bsize   = 6;
    uint32 namelen = 7;
    uint32 frsize  = 8;
}

// ---- Request messages (C → Go) ----

message LookupReq {
    uint64 parent = 1;
    string name   = 2;
}

message GetattrReq {
    uint64 ino = 1;
    uint64 fh  = 2;  // 0 if not open
}

message ReaddirReq {
    uint64 ino    = 1;
    uint64 fh     = 2;
    uint64 offset = 3;  // directory offset cookie
    uint32 size   = 4;  // max response size hint
}

message ReadlinkReq {
    uint64 ino = 1;
}

message StatfsReq {}

message CreateReq {
    uint64 parent = 1;
    string name   = 2;
    uint32 mode   = 3;   // file type + permissions
    uint32 flags  = 4;   // open flags (O_RDWR, O_CREAT, etc.)
    uint32 umask  = 5;
}

message MkdirReq {
    uint64 parent = 1;
    string name   = 2;
    uint32 mode   = 3;
    uint32 umask  = 4;
}

message UnlinkReq {
    uint64 parent = 1;
    string name   = 2;
}

message RmdirReq {
    uint64 parent = 1;
    string name   = 2;
}

message RenameReq {
    uint64 old_parent = 1;
    string old_name   = 2;
    uint64 new_parent = 3;
    string new_name   = 4;
    uint32 flags      = 5;  // 0 = rename, RENAME_NOREPLACE, RENAME_EXCHANGE
}

message SymlinkReq {
    uint64 parent = 1;
    string name   = 2;
    string target = 3;
}

message LinkReq {
    uint64 ino        = 1;
    uint64 new_parent = 2;
    string new_name   = 3;
}

message SetattrReq {
    uint64  ino   = 1;
    uint64  fh    = 2;  // 0 if not open
    Attr    attrs = 3;  // fields to set (zero = unchanged)
    uint32  valid = 4;  // bitmask: FATTR_MODE, FATTR_UID, FATTR_GID, FATTR_SIZE, FATTR_MTIME, FATTR_ATIME
}

message MknodReq {
    uint64 parent = 1;
    string name   = 2;
    uint32 mode   = 3;
    uint32 rdev   = 4;
    uint32 umask  = 5;
}

message OpenReq {
    uint64 ino   = 1;
    uint32 flags = 2;  // O_RDONLY, O_WRONLY, O_RDWR, O_DIRECT, etc.
}

message ReleaseReq {
    uint64 ino   = 1;
    uint64 fh    = 2;
    uint32 flags = 3;  // open flags at release time
}

message OpendirReq {
    uint64 ino = 1;
    uint32 flags = 2;
}

message ReleasedirReq {
    uint64 ino = 1;
    uint64 fh  = 2;
}

message AllocExtentsReq {
    uint64 ino  = 1;
    uint64 size = 2;  // total bytes to allocate
}

message CommitExtentsReq {
    uint64  ino     = 1;
    repeated Extent extents = 2;  // extents that were written to disk
}

message FsyncReq {
    uint64 ino      = 1;
    uint64 fh       = 2;
    bool   datasync = 3;  // true = fdatasync (data only), false = fsync (data + metadata)
}

message GetlkReq {
    uint64   ino  = 1;
    uint64   fh   = 2;
    LockInfo lock = 3;  // lock we want to check
}

message SetlkReq {
    uint64   ino   = 1;
    uint64   fh    = 2;
    LockInfo lock  = 3;  // lock we want to set
    uint32   flags = 4;  // F_SETLK (non-blocking) or F_SETLKW (blocking)
    uint32   pid   = 5;  // requester PID
}

// ---- Response messages (Go → C) ----

message LookupResp {
    uint64 ino          = 1;
    Attr   attr         = 2;
    double entry_timeout = 3;  // seconds
    double attr_timeout  = 4;  // seconds
    int32  error        = 5;   // 0 = success, negative = -errno
}

message AttrResp {
    Attr   attr        = 1;
    double attr_timeout = 2;  // seconds
    int32  error       = 3;
}

message ReaddirResp {
    repeated Dirent entries = 1;
    int32  error           = 2;
}

message ReadlinkResp {
    string target = 1;
    int32  error  = 2;
}

message StatfsResp {
    StatfsInfo info = 1;
    int32      error = 2;
}

message CreateResp {
    uint64 ino          = 1;
    Attr   attr         = 2;
    double entry_timeout = 3;
    double attr_timeout  = 4;
    int32  error        = 5;
}

message EmptyResp {
    int32 error = 1;
}

message AllocExtentsResp {
    repeated Extent extents = 1;
    int32  error           = 2;
}

message OpenResp {
    uint64 fh     = 1;   // file handle (opaque to kernel, used by daemon)
    uint32 flags  = 2;   // FOPEN_DIRECT_IO, FOPEN_KEEP_CACHE, FOPEN_NONSEEKABLE
    int32  error  = 3;
}

message GetlkResp {
    LockInfo lock  = 1;  // conflicting lock if any (type=F_UNLCK if none)
    int32    error = 2;
}

message FenceEvent {
    enum EventType {
        NODE_SELF_FENCED  = 0;   // this node has self-fenced
        NODE_FENCED       = 1;   // another node was externally fenced
        CACHE_INVALIDATE  = 2;   // kernel caches should be invalidated for an inode
    }
    EventType type   = 1;
    uint64    ino    = 2;  // for CACHE_INVALIDATE
    string    node_id = 3;  // for NODE_FENCED
}
