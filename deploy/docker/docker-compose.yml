# EtcFS Development Environment
#
# Simulates a 3-node EtcFS cluster on a single machine:
#   - 3 etcd nodes (colocated pattern — one per EtcFS node)
#   - 1 loopback block device shared via Docker volumes
#   - 3 etcfuse-meta (Go) + 3 etcfuse (C) daemon pairs
#
# Usage:
#   docker compose up -d                  # start the cluster
#   docker compose logs -f                # tail logs
#   docker compose down -v                # tear down
#
# The FUSE mount is accessible inside each container at /mnt/etcfuse.
# For host-level access, mount the FUSE filesystem inside the container
# and bind-mount it to the host (requires privileged mode for FUSE).

version: "3.9"

services:
  # ---- 3-node etcd cluster ----

  etcd1:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: etcfs-etcd1
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=etcfuse-dev
      # Without compaction every superseded revision is kept forever, and a
      # filesystem writes metadata constantly: the store grows until it trips
      # the backend quota and etcd goes read-only, which stops the mount.
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=100000
      - --quota-backend-bytes=8589934592
      - --initial-cluster-state=new
    volumes:
      - etcd1_data:/etcd-data
    networks:
      - etcfuse-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd2:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: etcfs-etcd2
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=etcfuse-dev
      # Without compaction every superseded revision is kept forever, and a
      # filesystem writes metadata constantly: the store grows until it trips
      # the backend quota and etcd goes read-only, which stops the mount.
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=100000
      - --quota-backend-bytes=8589934592
      - --initial-cluster-state=new
    volumes:
      - etcd2_data:/etcd-data
    networks:
      - etcfuse-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd3:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: etcfs-etcd3
    command:
      - etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=etcfuse-dev
      # Without compaction every superseded revision is kept forever, and a
      # filesystem writes metadata constantly: the store grows until it trips
      # the backend quota and etcd goes read-only, which stops the mount.
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=100000
      - --quota-backend-bytes=8589934592
      - --initial-cluster-state=new
    volumes:
      - etcd3_data:/etcd-data
    networks:
      - etcfuse-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Block device simulator (loopback file) ----
  # Creates a file-backed block device shared across all EtcFS nodes.
  # In production this is an io2 Multi-Attach EBS volume.
  block-init:
    image: alpine:3.20
    container_name: etcfs-block-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache e2fsprogs-extra
        # Sparse, so it costs nothing until written.  It has to hold one 1 GiB
        # arena per node with room to acquire more, and the allocator now
        # refuses an arena that would not fit on the device.
        truncate -s 8G /block-device/etcfuse.img
        chmod 666 /block-device/etcfuse.img
        echo "Block device initialised: 8 GiB sparse file at /block-device/etcfuse.img"
    volumes:
      - block_data:/block-device
    networks:
      - etcfuse-net

  # ---- EtcFS Meta nodes (Go — metadata backend) ----
  etcfuse-meta1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.etcfuse-meta
    container_name: etcfs-meta1
    command:
      - --listen=/run/etcfuse/etcfuse.sock
      - --etcd-endpoints=http://etcd1:2379
      - --node-id=n1
      - --cluster-name=docker-chaos
      - --lease-ttl=10s
      - --block-device=/block-device/etcfuse.img
      - --log-level=1
    volumes:
      - meta1_sock:/var/run
      - block_data:/block-device
    networks:
      - etcfuse-net
    depends_on:
      etcd1:
        condition: service_healthy
      block-init:
        condition: service_completed_successfully

  etcfuse-meta2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.etcfuse-meta
    container_name: etcfs-meta2
    command:
      - --listen=/run/etcfuse/etcfuse.sock
      - --etcd-endpoints=http://etcd2:2379
      - --node-id=n2
      - --cluster-name=docker-chaos
      - --lease-ttl=10s
      - --block-device=/block-device/etcfuse.img
      - --log-level=1
    volumes:
      - meta2_sock:/var/run
      - block_data:/block-device
    networks:
      - etcfuse-net
    depends_on:
      etcd2:
        condition: service_healthy
      block-init:
        condition: service_completed_successfully

  etcfuse-meta3:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.etcfuse-meta
    container_name: etcfs-meta3
    command:
      - --listen=/run/etcfuse/etcfuse.sock
      - --etcd-endpoints=http://etcd3:2379
      - --node-id=n3
      - --cluster-name=docker-chaos
      - --lease-ttl=10s
      - --block-device=/block-device/etcfuse.img
      - --log-level=1
    volumes:
      - meta3_sock:/var/run
      - block_data:/block-device
    networks:
      - etcfuse-net
    depends_on:
      etcd3:
        condition: service_healthy
      block-init:
        condition: service_completed_successfully

  # ---- EtcFS FUSE nodes (C — FUSE daemon) ----
  etcfuse1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.etcfuse
    container_name: etcfs-fuse1
    privileged: true
    devices:
      - /dev/fuse
    entrypoint: ["/bin/sh", "-c", "mkdir -p /mnt/etcfuse && exec /usr/local/bin/etcfuse \"$@\"", "--"]
    command:
      - --socket=/run/etcfuse/etcfuse.sock
      - --node-id=n1
      - --log-level=1
      - /mnt/etcfuse
    volumes:
      - meta1_sock:/var/run
    networks:
      - etcfuse-net
    depends_on:
      - etcfuse-meta1

  etcfuse2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.etcfuse
    container_name: etcfs-fuse2
    privileged: true
    devices:
      - /dev/fuse
    entrypoint: ["/bin/sh", "-c", "mkdir -p /mnt/etcfuse && exec /usr/local/bin/etcfuse \"$@\"", "--"]
    command:
      - --socket=/run/etcfuse/etcfuse.sock
      - --node-id=n2
      - --log-level=1
      - /mnt/etcfuse
    volumes:
      - meta2_sock:/var/run
    networks:
      - etcfuse-net
    depends_on:
      - etcfuse-meta2

  etcfuse3:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.etcfuse
    container_name: etcfs-fuse3
    privileged: true
    devices:
      - /dev/fuse
    entrypoint: ["/bin/sh", "-c", "mkdir -p /mnt/etcfuse && exec /usr/local/bin/etcfuse \"$@\"", "--"]
    command:
      - --socket=/run/etcfuse/etcfuse.sock
      - --node-id=n3
      - --log-level=1
      - /mnt/etcfuse
    volumes:
      - meta3_sock:/var/run
    networks:
      - etcfuse-net
    depends_on:
      - etcfuse-meta3

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  block_data:
  meta1_sock:
  meta2_sock:
  meta3_sock:

networks:
  etcfuse-net:
    driver: bridge
