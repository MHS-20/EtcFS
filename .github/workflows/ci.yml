name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  lint-c:
    name: Lint (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get install -y clang-format
          find cmd/etcfuse pkg/fuse pkg/block pkg/wal \
            -name '*.c' -o -name '*.h' \
            -exec clang-format --dry-run --Werror {} +

  lint-sh:
    name: Lint (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/infra/*.sh scripts/test/*.sh

  build-go:
    name: Build (Go)
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        run: go build ./cmd/etcfuse-meta

  build-c:
    name: Build (C)
    runs-on: ubuntu-latest
    needs: [lint-c]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get install -y libfuse3-dev
      - name: Build
        run: |
          make -C cmd/etcfuse

  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    needs: [build-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test -race -count=1 ./...

  test-integration:
    name: Test (Integration)
    runs-on: ubuntu-latest
    needs: [build-go, build-c]
    steps:
      - uses: actions/checkout@v4
      - name: Integration smoke test
        run: |
          # Start etcd + build both binaries, verify they connect
          echo "Integration tests will be added in subsequent phases"
