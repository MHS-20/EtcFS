name: CI / Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The version lives in .golangci-version so CI and the pre-push hook
      # install the same linter; a local one built with a different Go reports
      # different findings, or refuses go.mod's target outright.
      - id: linter
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"
      # Held at action v6: v7 and later require golangci-lint v2, which is a
      # config-format migration of its own.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ steps.linter.outputs.version }}
          args: --timeout=5m

  lint-c:
    name: Lint (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: clang-format check
        run: |
          sudo apt-get install -y clang-format
          find cmd/etcfuse pkg/fuse pkg/block test/c \
            -name '*.c' -o -name '*.h' \
            -exec clang-format --dry-run --Werror {} +

  lint-sh:
    name: Lint (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/infra/*.sh scripts/test/*.sh

  build-go:
    name: Build (Go)
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./cmd/etcfuse-meta

  build-c:
    name: Build (C)
    runs-on: ubuntu-latest
    needs: [lint-c]
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: sudo apt-get install -y libfuse3-dev
      - name: Build
        run: make -C cmd/etcfuse
      - name: Test
        run: make test-c

  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    needs: [build-go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-integration:
    name: Test (Integration)
    runs-on: ubuntu-latest
    needs: [build-go, build-c]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start etcd
        run: |
          curl -sL https://github.com/etcd-io/etcd/releases/download/v3.5.18/etcd-v3.5.18-linux-amd64.tar.gz | tar xz
          sudo mv etcd-v3.5.18-linux-amd64/etcd etcd-v3.5.18-linux-amd64/etcdctl /usr/local/bin/
          mkdir -p /tmp/etcd-data
          etcd --data-dir=/tmp/etcd-data --listen-client-urls=http://127.0.0.1:2379 --advertise-client-urls=http://127.0.0.1:2379 &
          sleep 3
          etcdctl endpoint health
      - name: Run integration tests
        env:
          ETCD_ENDPOINTS: http://127.0.0.1:2379
        run: go test -tags=integration -count=1 -timeout 600s ./...

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [lint-go, lint-c, lint-sh, build-go, build-c, test-go, test-integration]
    if: github.event_name == 'push'
    outputs:
      released: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      version_major: ${{ steps.semrel.outputs.new_release_major_version }}
      version_minor: ${{ steps.semrel.outputs.new_release_minor_version }}
      version_patch: ${{ steps.semrel.outputs.new_release_patch_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
