name: Bug report
description: Something the filesystem got wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything touching data integrity, the output of `etcfuse-meta --fsck`
        is worth more than a description of the symptom. Do not report a security
        vulnerability here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, a test, or a chaos scenario.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `etcfuse-meta --version`.
    validations:
      required: true
  - type: dropdown
    id: fencing
    attributes:
      label: Fencing mode
      options:
        - EBS detach (--ebs-volume-id)
        - NVMe reservations (--nvme-reservations)
        - Single-signal (neither)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        etcd version, number of nodes, device type, kernel, and whether the
        mount uses `--allow-buffered-io`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant part of `/tmp/meta.log` and `/tmp/fuse.log`.
      render: shell
